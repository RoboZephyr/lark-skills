# ============================================================
# Progress Report — 配置模板
# ============================================================
# 默认继承 weekly-report 的 GitHub / team / lark / delivery 配置。
# 复制为 config.yaml 后，只需要填写想覆盖的字段。

extends_config: "skills/weekly-report/config.yaml"

github:
  # 留空则使用 extends_config.github.repos
  repos: []
  # 优先级: GITHUB_TOKEN 环境变量 > 本字段 > gh auth token
  token: ""

team:
  # 留空则使用 extends_config.team
  members: []
  gitlab_to_github: {}

report:
  default_days: 7
  include_all_branches: true
  include_open_prs: true
  # PR 模式不受时间范围限制；通过 --pr 指定 PR URL / owner/repo#123 / #123
  max_branches_per_repo: 80
  max_commits_per_section: 12
  language: zh

output:
  # local: 只生成报告/可复制消息，不调用飞书 API
  # message_only: 只发送飞书消息，不创建文档
  # doc_only: 创建飞书文档并处理权限，不发送消息
  # doc_and_message: 创建文档并发送带链接的消息
  # 用户明确要求会覆盖这里的默认值。
  mode: local

lark:
  # 留空则使用 extends_config.lark
  permissions: {}

delivery:
  # 留空则使用 extends_config.delivery
  # 只在 message_only / doc_and_message 模式下使用；默认不自动投递。
  enabled: false
  targets: []
